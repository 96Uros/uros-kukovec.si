<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uroš Kukovec s.p.</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="logo-container">
                <img src="{{ url_for('static', filename='images/logo_me.png') }}" alt="Logo" class="logo">
            </div>
            <h1 class="welcome">DOBRODOŠLI</h1>
            <p class="description">Računalniško programiranje & 3D Tisk</p> 
            <p class="company">Uroš Kukovec s.p.</p>
            <div class="form-container">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        <div class="messages">
                            {% for category, message in messages %}
                                <div class="message {{ category }}">{{ message }}</div>
                            {% endfor %}
                        </div>
                    {% endif %}
                {% endwith %}
                
                <form method="POST" action="/" class="contact-form">
                    <div class="form-group">
                        <label for="ime_priimek">Ime Priimek <span class="required"> *</span></label>
                        <input type="text" id="ime_priimek" name="ime_priimek" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email <span class="required"> *</span></label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="telefonska">Telefonska Številka <span class="required"> *</span></label>
                        <input type="tel" id="telefonska" name="telefonska" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="naslov">Naslov Projekta <span class="required"> *</span></label>
                        <input type="text" id="naslov" name="naslov" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="podrobnosti">Podrobnosti <span class="required"> *</span></label>
                        <textarea id="podrobnosti" name="podrobnosti" rows="5" required></textarea>
                    </div>
                    
                    <button type="submit" class="submit-btn">Pošlji</button>
                </form>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/notification.js') }}"></script>
</body>
</html>
