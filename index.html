<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>96Uroš</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>
    <video class="background-video" autoplay muted loop playsinline>
      <source src="assets/videos/bg1.mp4" type="video/mp4" />
    </video>
    <div class="overlay"></div>
    <div class="starfield" aria-hidden="true"></div>

    <div class="container">
      <div class="content">
        <h1 class="name">UROŠ KUKOVEC S.P</h1>
        <br />
        <p class="subtitle">OD IDEJE DO DIGITALNE IZKUŠNJE.</p>
        <p class="contact">
          <a href="mailto:uros-kukovec@outlook.com">uros-kukovec@outlook.com</a>
          <span class="contact-separator"> | </span>
          <a href="tel:+38640325711">+386 40 325 711</a>
          <!-- Raje kot stalk pokliči za kakšno storitev :D -->
        </p>
      </div>
    </div>
    <p class="service-line bottom-service-line">
      Uroš Kukovec s.p., računalniško programiranje in 3D tisk
    </p>
    <script>
      const starfield = document.querySelector(".starfield");
      if (starfield) {
        const starsCount = 70;
        for (let i = 0; i < starsCount; i += 1) {
          const star = document.createElement("span");
          star.className = "star";
          star.style.left = `${Math.random() * 100}%`;
          star.style.top = `${Math.random() * 100}%`;
          star.style.width = `${Math.random() * 2 + 1}px`;
          star.style.height = star.style.width;
          star.style.animationDelay = `${Math.random() * 4}s`;
          star.style.animationDuration = `${2 + Math.random() * 3}s`;
          starfield.appendChild(star);
        }
      }
    </script>
  </body>
</html>
